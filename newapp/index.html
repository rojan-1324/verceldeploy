<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    height:100vh;
    background:#0f172a;
    color:#e2e8f0;
    font-family:sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;}
  #board{background:#1e293b;border-radius:12px;}
  .msg{min-height:1.4em;color:#22c55e;font-weight:600;}
  button{background:#22c55e;color:#04250f;border:none;padding:10px 20px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;}
  button:hover{background:#16a34a;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 SNAKE</h1>
  <div>Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="msg" id="msg"></div>
  <button id="startBtn">Start</button>
  <div>Arrow keys / WASD to move. Space to pause.</div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');

const GRID = 20;
const cell = canvas.width / GRID;

let snake, dir, nextDir, food, score, best = 0, running = false, paused = false;

function resetGame(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  scoreEl.textContent = score;
  placeFood();
  running = true;
  paused = false;
  msgEl.textContent = '';
}

function placeFood(){
  let pos;
  while(true){
    pos = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
    if(!snake.some(s => s.x===pos.x && s.y===pos.y)) break;
  }
  food = pos;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#f97316';
  ctx.fillRect(food.x*cell, food.y*cell, cell-1, cell-1);
  snake.forEach((seg,i) => {
    ctx.fillStyle = i===0 ? '#22c55e' : '#16a34a';
    ctx.fillRect(seg.x*cell, seg.y*cell, cell-1, cell-1);
  });
}

function tick(){
  if(!running || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if(head.x<0 || head.x>=GRID || head.y<0 || head.y>=GRID){
    return gameOver();
  }
  if(snake.some(s => s.x===head.x && s.y===head.y)){
    return gameOver();
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    scoreEl.textContent = score;
    if(score>best){ best = score; bestEl.textContent = best; }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver(){
  running = false;
  msgEl.textContent = 'Game over! Press Start to play again.';
  startBtn.textContent = 'Start';
}

function setDir(x,y){
  if(snake.length>1 && dir.x===-x && dir.y===-y) return;
  nextDir = {x,y};
}

document.addEventListener('keydown', e => {
  switch(e.key){
    case 'ArrowUp': case 'w': setDir(0,-1); e.preventDefault(); break;
    case 'ArrowDown': case 's': setDir(0,1); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': setDir(-1,0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': setDir(1,0); e.preventDefault(); break;
    case ' ':
      if(running){ paused = !paused; msgEl.textContent = paused ? 'Paused' : ''; }
      e.preventDefault();
      break;
  }
});

startBtn.addEventListener('click', () => {
  resetGame();
  startBtn.textContent = 'Restart';
  draw();
});

setInterval(tick, 110);

// initial state
snake = [{x:10,y:10}];
food = {x:15,y:10};
draw();
</script>
</body>
</html>
